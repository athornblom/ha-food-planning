blueprint:
  name: Cooking timer finished – notification
  description: >-
    Sends a phone notification with the timer's name when a Food Planning
    cooking timer finishes. Optionally runs more actions, e.g. flashing a
    light or announcing it on a speaker.
  domain: automation
  source_url: https://github.com/athornblom/ha-food-planning/blob/main/blueprints/automation/food_planning/cooking_timer_finished.yaml
  input:
    timer_event:
      name: Timer event
      description: The Food Planning "Cooking timer" event entity.
      default: event.food_planning_timer
      selector:
        entity:
          filter:
            - integration: food_planning
              domain: event
    notify_device:
      name: Phone
      description: The phone (Companion app) that gets the notification.
      selector:
        device:
          filter:
            - integration: mobile_app
    title:
      name: Title
      default: "⏰ Timer finished"
      selector:
        text:
    extra_actions:
      name: More actions
      description: Also run when a timer finishes. The timer's name is in the variable "label", the recipe in "recipe".
      default: []
      selector:
        action:

mode: queued
max: 10

triggers:
  - trigger: state
    entity_id: !input timer_event

conditions:
  - condition: template
    value_template: "{{ trigger.to_state.attributes.event_type == 'finished' }}"

variables:
  label: "{{ trigger.to_state.attributes.label }}"
  recipe: "{{ trigger.to_state.attributes.recipe }}"

actions:
  - domain: mobile_app
    type: notify
    device_id: !input notify_device
    title: !input title
    message: "{{ label }}{{ ' (' ~ recipe ~ ')' if recipe and recipe != label else '' }}"
  - choose: []
    default: !input extra_actions
